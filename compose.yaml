services:
  wallpaper-server:
    image: ghcr.io/REPLACE_WITH_GITHUB_OWNER/open-wallpaper:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "mysql://wallpaper:${MYSQL_PASSWORD}@mysql:3306/open_wallpaper"
      AUTO_SCAN: "true"
      # PUBLIC_URL: "https://wallpaper.example.com"
    volumes:
      - wallpaper-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: open_wallpaper
      MYSQL_USER: wallpaper
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  wallpaper-data:
  mysql-data:
