name: MySQL application checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mysql-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: open_wallpaper
          MYSQL_USER: wallpaper
          MYSQL_PASSWORD: test-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: open_wallpaper
      DB_USER: wallpaper
      DB_PASSWORD: test-app-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies and test runner
        run: python -m pip install -r server/requirements.txt pytest
      - name: Run MySQL access-control tests
        run: pytest -q
