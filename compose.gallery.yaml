services:
  wallpaper-server:
    environment:
      GALLERY_API_URL: ${GALLERY_API_URL:?Set GALLERY_API_URL in .env}
      GALLERY_CLIENT_INSTANCE: ${GALLERY_CLIENT_INSTANCE:?Set a unique GALLERY_CLIENT_INSTANCE in .env}
      GALLERY_MEDIA_ROOT: /app/data/external/gallery
      GALLERY_TOKEN_ENCRYPTION_KEY: ${GALLERY_TOKEN_ENCRYPTION_KEY:?Set GALLERY_TOKEN_ENCRYPTION_KEY in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-0}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
    volumes:
      - type: bind
        source: ${GALLERY_MEDIA_SOURCE:?Set GALLERY_MEDIA_SOURCE in .env}
        target: /app/data/external/gallery
        read_only: true
        bind:
          create_host_path: false
